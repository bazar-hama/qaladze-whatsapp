<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qaladze_Bazar | ئەلیکتڕۆنی و مۆبایل</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #101b2d 0%, #070a10 65%);
      color: #f3f6fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .phone-frame {
      width: 100%;
      max-width: 410px;
      background: rgba(15, 22, 36, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.22);
      border-radius: 26px;
      padding: 26px 20px;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.65), 0 0 30px rgba(14, 165, 233, 0.08);
      text-align: center;
    }
    .top-tag {
      display: inline-block;
      font-size: 11px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 18px;
      letter-spacing: 0.4px;
    }
    .avatar-box {
      width: 104px;
      height: 104px;
      margin: 0 auto 16px;
      border-radius: 28px;
      padding: 2px;
      background: linear-gradient(135deg, #38bdf8, #22c55e);
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.22);
    }
    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 26px;
      background: #0b111c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 800;
      color: #38bdf8;
    }
    .brand {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      direction: ltr;
      margin-bottom: 6px;
    }
    .desc {
      font-size: 13.5px;
      color: #9fb0c7;
      line-height: 1.65;
      margin-bottom: 20px;
    }
    .specs-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 22px;
    }
    .spec-pill {
      background: #0b111c;
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 12px;
      padding: 9px 6px;
      font-size: 11.5px;
      color: #cbd5e1;
    }
    .spec-pill strong {
      display: block;
      color: #38bdf8;
      font-size: 12.5px;
      margin-bottom: 2px;
    }
    .wa-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: linear-gradient(90deg, #16a34a, #22c55e);
      color: #06130b;
      text-decoration: none;
      font-weight: 800;
      font-size: 16px;
      padding: 15px 18px;
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(34, 197, 94, 0.25);
      transition: transform 0.15s ease, filter 0.2s ease;
    }
    .wa-btn:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }
    .wa-btn-text {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .wa-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(6, 19, 11, 0.16);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
    }
    .wa-arrow {
      font-size: 18px;
      font-weight: bold;
    }
    .info-box {
      margin-top: 16px;
      background: #0b111c;
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 12.5px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .info-box span:last-child {
      color: #e2e8f0;
      direction: ltr;
      font-weight: bold;
    }
    .footer {
      margin-top: 18px;
      font-size: 11.5px;
      color: #64748b;
      direction: ltr;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="top-tag">⚡ MOBILE & ELECTRONICS</div>

    <div class="avatar-box">
      <div class="avatar-inner">QB</div>
    </div>

    <div class="brand">Qaladze_Bazar</div>
    <p class="desc">مۆبایل، ئیکسسوارات و بەرهەمە ئەلیکتڕۆنییەکان — بۆ نرخ و داواکاری نامە بنێرە</p>

    <div class="specs-row">
      <div class="spec-pill">
        <strong>مۆبایل</strong>
        ئامێر و بەش
      </div>
      <div class="spec-pill">
        <strong>ئەلیکتڕۆنی</strong>
        کەلوپەلی نوێ
      </div>
      <div class="spec-pill">
        <strong>گەیاندن</strong>
        بە خێرایی
      </div>
    </div>

    <a
      class="wa-btn"
      href="https://wa.me/9647508475838?text=%D8%B2%D8%A7%D9%86%DB%8C%D8%A7%D8%B1%DB%8C"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="wa-btn-text">
        <span class="wa-icon">W</span>
        <span>پەیوەندی لە واتسئاپ</span>
      </span>
      <span class="wa-arrow">←</span>
    </a>

    <div class="info-box">
      <span>ژمارەی واتسئاپ</span>
      <span>0750 847 5838</span>
    </div>

    <div class="footer">Qaladze_Bazar • Tech & Mobile Store</div>
  </div>
</body>
</html>
